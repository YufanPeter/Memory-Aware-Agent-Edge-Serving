[project]
name = "agentserve"
version = "0.1.0"
description = "Layered, pluggable framework for evaluating memory-aware scheduling of agent workloads"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pandas>=2.2",
  "pyarrow>=15",
  "psutil>=5.9",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentserve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
