[project]
name = "edgeserve"
version = "0.1.0"
description = "Memory-aware agent edge serving: HotpotQA ReAct workload, FIFO runner, instrumentation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "bm25s>=0.2",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "psutil>=5.9",
]

[project.optional-dependencies]
analysis = ["transformers>=4.44", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgeserve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
