# Context-size / memory-budget study: fixed K, vary KV pool and workload.
ref: _base.yaml
name: phase1_context
scheduler: {max_concurrency: 8}
backend: {parallel: 8}
workload: {n_tasks: 40, arrival: {type: poisson, rate: 0.5}}
sweep:
  backend.ctx_size: [8192, 16384, 32768]
  workload.mix:
    - [{name: short_ctx, task: hotpotqa, weight: 1, tags: {context: short, max_tokens: 128}}]
    - [{name: long_ctx,  task: hotpotqa, weight: 1, tags: {context: long,  max_tokens: 384}}]
