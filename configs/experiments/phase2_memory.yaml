# Overflow cliff (#8): long-context agents in a small KV pool. FCFS at fixed K
# hits "Context size has been exceeded" (all in-flight requests fail);
# mem_aware admits by projected KV instead.
ref: _base.yaml
name: phase2_memory
backend: {parallel: 8, ctx_size: 6144}
workload:
  n_tasks: 30
  arrival: {type: poisson, rate: 0.6}
  mix:
    - {name: long_ctx, task: hotpotqa, weight: 0.7, tags: {context: long, max_tokens: 384}}
    - {name: short_ctx, task: hotpotqa, weight: 0.3, tags: {context: short, max_tokens: 128}}
seeds: [0]
sweep:
  scheduler:
    - {ref: schedulers/fcfs.yaml, max_concurrency: 4}
    - {ref: schedulers/fcfs.yaml, max_concurrency: 8}
    - {ref: schedulers/mem_aware.yaml, order: fcfs, retention: {type: lru, mode: erase}}
    - {ref: schedulers/mem_aware.yaml, order: fcfs, retention: {type: lru, mode: swap}}
    - {ref: schedulers/mem_aware.yaml, order: las, retention: {type: lru, mode: erase}}
