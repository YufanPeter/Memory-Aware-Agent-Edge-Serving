# Preemptive policies (#4-#8) vs FCFS under a tight KV budget with a short/long mix.
ref: _base.yaml
name: phase2_policies
backend: {parallel: 8, ctx_size: 8192}
workload: {n_tasks: 40, arrival: {type: poisson, rate: 0.5}}
seeds: [0]
sweep:
  scheduler:
    - {ref: schedulers/fcfs.yaml}
    - {ref: schedulers/rr.yaml}
    - {ref: schedulers/srpt.yaml}
    - {ref: schedulers/mlfq.yaml}
    - {ref: schedulers/las.yaml}
    - {ref: schedulers/mem_aware.yaml, order: las}
  workload.arrival.rate: [0.3, 0.6]
