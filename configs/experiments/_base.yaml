# Shared defaults; experiment files ref this and override.
model: {ref: models/qwen2.5-1.5b-q4km.yaml}
backend: {ref: backends/llamacpp.yaml}
scheduler: {ref: schedulers/fcfs.yaml}
tasks:
  hotpotqa: {ref: tasks/hotpotqa.yaml}
agent: {ref: agents/react_full.yaml}
workload: {ref: workloads/mixed.yaml}
monitors:
  - {type: process_mem, interval: 0.2}
  - {type: scheduler_state, interval: 0.2}
  - {type: backend_probe, interval: 0.5}
  - {type: nvidia_smi, interval: 0.5}
run:
  task_timeout: 600
  warmup_requests: 2
seed: 0
