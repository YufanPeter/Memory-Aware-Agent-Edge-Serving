# Task profiles (see edgeserve/profiles.py). A workload mixes these.
defaults:
  few_shot: 6
  max_steps: 6
  n_predict: 128
  max_parse_errors: 2
  # Tool latency = idle gap between an agent's LLM calls. Scaled per run with --delay-scale.
  delay: {type: lognormal, median: 0.8, sigma: 0.6, max_s: 5.0}
  per_tool_delay:
    lookup: {type: fixed, seconds: 0.1}

profiles:
  # Multi-step, short context, short output.
  react_short:
    search_sentences: 3
  # Multi-step, long context: each search returns the whole paragraph plus 4 BM25-related ones.
  react_long:
    search_sentences: 0
    neighbors: 4
  # Multi-step, short context, long output (an explanation before finish).
  react_explain:
    search_sentences: 3
    explain: true
    n_predict: 512
  # Single step, long context: the question's own 10 paragraphs, answered without tools.
  oneshot_long:
    mode: oneshot
    max_steps: 1
    n_predict: 256
  # Quality baseline only (not part of serving workloads): no retrieval, answer from memory.
  closedbook:
    mode: closedbook
    max_steps: 1
    n_predict: 128
